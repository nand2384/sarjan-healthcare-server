services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sarjan-backend

    ports:
      - "3000:3000"

    env_file:
      - .env
    
    environment:
      REDIS_URL: redis://redis:6379

    depends_on:
      - redis

    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: sarjan-redis

    ports:
      - "6379:6379"

    restart: unless-stopped

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data: